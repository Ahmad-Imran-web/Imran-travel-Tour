{% extends "base.html" %}

{% block title %}Sign In & Portal Access | WanderLuxe{% endblock %}

{% block content %}
<section class="py-16 bg-slate-50 flex items-center justify-center min-h-[75vh]">
  <div class="max-w-md w-full mx-auto px-4">
    
    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-200">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-brand-navy text-brand-gold flex items-center justify-center mx-auto mb-3 shadow-md">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-serif font-bold text-brand-navy">Welcome to WanderLuxe</h1>
        <p class="text-xs text-slate-500 mt-1">Sign in to manage your luxury vacations and bookings</p>
      </div>

      <form action="/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
            <input type="email" id="login-email" name="email" required placeholder="admin@wanderluxe.com" 
                   class="w-full pl-9 pr-4 py-2.5 text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-gold">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold uppercase text-slate-600">Password</label>
            <a href="#" class="text-[11px] text-brand-gold hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
            <input type="password" id="login-password" name="password" required placeholder="••••••••" 
                   class="w-full pl-9 pr-4 py-2.5 text-sm bg-slate-50 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-gold">
          </div>
        </div>

        <button type="submit" class="w-full bg-brand-navy hover:bg-brand-dark text-white font-bold text-sm py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4 text-brand-gold"></i>
        </button>
      </form>

      <!-- QUICK 1-CLICK DEMO CREDENTIALS -->
      <div class="mt-8 pt-6 border-t border-slate-100 bg-amber-50/70 p-4 rounded-2xl border border-amber-200/60">
        <span class="text-[11px] font-bold uppercase tracking-wider text-amber-800 block mb-1">Quick Demo Admin Access</span>
        <p class="text-xs text-slate-600 mb-3">Click below to auto-fill administrator credentials:</p>
        <button onclick="document.getElementById('login-email').value='admin@wanderluxe.com'; document.getElementById('login-password').value='admin123'; showToast('Admin credentials filled! Click Sign In.', 'info');" 
                class="w-full bg-brand-gold hover:bg-brand-goldHover text-brand-navy font-bold text-xs py-2 px-3 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5">
          <i data-lucide="key" class="w-3.5 h-3.5"></i> Auto-fill Admin Login (admin@wanderluxe.com)
        </button>
      </div>

    </div>

  </div>
</section>
{% endblock %}
